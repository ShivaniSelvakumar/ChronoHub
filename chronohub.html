<!DOCTYPE html>
<html lang="en">
<head>
    
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="default-theme">

    <header>
    <div class="header-text">
        <h1> ⏱ ChronoHub</h1>
        <p>Built for Every Tick.</p>
    </div>
</header>

    <div class="container">

        <nav>
            <button class="clock">🕒 Clock</button>
            <button class="stop-watch">⏱ Stopwatch</button>
            <button class="timer">⏳ Timer</button>
            <button class="world-clock">🌍 World Clock</button>
            <button class="themes">🎨 Themes</button>
        </nav>

        <main>
            <h2>Welcome to ChronoHub</h2>
            <p>Select a feature from the sidebar.</p>
        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
